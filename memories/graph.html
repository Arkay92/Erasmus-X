
<!DOCTYPE html>
<html>
<head>
    <title>Neurosymbolic Knowledge Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: #0b0e14; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        .node { stroke: #fff; stroke-width: 1.5px; cursor: pointer; }
        .link { stroke: #4a4e69; stroke-opacity: 0.6; stroke-width: 1px; }
        .label { fill: #9a9dbd; font-size: 10px; pointer-events: none; }
        .node-label { fill: #ffffff; font-size: 12px; pointer-events: none; text-shadow: 0 0 5px #000; }
        #header { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(20, 24, 33, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #2d3446; }
        h1 { margin: 0; font-size: 18px; color: #4cc9f0; text-transform: uppercase; letter-spacing: 2px; }
        p { margin: 5px 0 0; font-size: 11px; opacity: 0.7; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Gemma Knowledge Graph</h1>
        <p>Interactive Visualization of Learned Concepts</p>
    </div>
    <svg id="viz"></svg>

    <script>
        const data = {"nodes": [{"id": "capital of france", "name": "capital of france"}, {"id": "paris", "name": "paris"}, {"id": "prime minister of the uk", "name": "prime minister of the uk"}, {"id": "[current pm's name]", "name": "[current pm's name]"}, {"id": "political leader of the country", "name": "political leader of the country"}, {"id": "nvidia", "name": "nvidia"}, {"id": "[partner name]", "name": "[partner name]"}], "links": [{"source": "capital of france", "target": "paris", "label": "is"}, {"source": "prime minister of the uk", "target": "[current pm's name]", "label": "is"}, {"source": "prime minister of the uk", "target": "political leader of the country", "label": "is the"}, {"source": "nvidia", "target": "[partner name]", "label": "has_partnership"}]};
        
        const width = window.innerWidth;
        const height = window.innerHeight;

        const svg = d3.select("#viz")
            .attr("width", width)
            .attr("height", height)
            .call(d3.zoom().on("zoom", (event) => {
                container.attr("transform", event.transform);
            }));

        const container = svg.append("g");

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-300))
            .force("center", d3.forceCenter(width / 2, height / 2));

        // Define arrow markers
        svg.append("defs").append("marker")
            .attr("id", "arrowhead")
            .attr("viewBox", "-0 -5 10 10")
            .attr("refX", 20)
            .attr("refY", 0)
            .attr("orient", "auto")
            .attr("markerWidth", 6)
            .attr("markerHeight", 6)
            .attr("xoverflow", "visible")
            .append("svg:path")
            .attr("d", "M 0,-5 L 10 ,0 L 0,5")
            .attr("fill", "#4a4e69")
            .style("stroke","none");

        const link = container.append("g")
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("class", "link")
            .attr("marker-end", "url(#arrowhead)");

        const edgeLabels = container.append("g")
            .selectAll("text")
            .data(data.links)
            .join("text")
            .attr("class", "label")
            .text(d => d.label);

        const node = container.append("g")
            .selectAll("circle")
            .data(data.nodes)
            .join("circle")
            .attr("r", 8)
            .attr("class", "node")
            .attr("fill", d => d3.interpolateTurbo(Math.random()))
            .call(d3.drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended));

        const nodeLabels = container.append("g")
            .selectAll("text")
            .data(data.nodes)
            .join("text")
            .attr("class", "node-label")
            .attr("dx", 12)
            .attr("dy", 4)
            .text(d => d.name);

        simulation.on("tick", () => {
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);
            
            nodeLabels
                .attr("x", d => d.x)
                .attr("y", d => d.y);

            edgeLabels
                .attr("x", d => (d.source.x + d.target.x) / 2)
                .attr("y", d => (d.source.y + d.target.y) / 2);
        });

        function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
        }

        function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
        }

        function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            event.subject.fx = null;
            event.subject.fy = null;
        }
    </script>
</body>
</html>
